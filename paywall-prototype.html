<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Satispay Plans Paywall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --title:#290402; --muted:#6f5f5d; --stroke:#dcdcdc; --orange:#ff3d00; --gray-btn:#eeeeee; --surface:#fff;
  --sb:62px;                 /* status bar height (frame mode) */
  --ic1:#2999ff; --ic2:#004b8f;
  --t1:#5cb1ff; --t2:#0065c2; --accent:#0a6fd6;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
img{max-width:none}
html,body{height:100%}
body.dragging,body.dragging *{user-select:none!important}
html.embed,body.embed{background:#f6f6f6!important;transition:background-color .3s ease}
html.embed.dark,body.embed.dark{background:#1a1a1a!important}
body{font-family:'Inter',-apple-system,system-ui,sans-serif;color:var(--title);background:#e6e6e6;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- stage / device ---------- */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.device{position:relative;width:393px;height:852px;flex:none}
.screen{position:relative;width:100%;height:100%;overflow:hidden;background:var(--surface);isolation:isolate}
body.framed .device{padding:0}
body.framed .screen{border-radius:52.30px}
/* iPhone frame rebuilt from Figma "Home" node 24401:37460 (top half mirrored to the bottom) */
.bezel{display:none;position:absolute;left:-19.43px;right:-19.43px;top:-19.43px;bottom:-19.43px;z-index:-1;pointer-events:none}
body.framed .bezel{display:block}
.bz{position:absolute;display:block}
.bz.l1{inset:0;border-radius:71.73px;background:#464646;box-shadow:0 40px 80px -10px rgba(0,0,0,.35),0 14px 30px -12px rgba(0,0,0,.3)}
.bz.l2{inset:4.48px;border-radius:67.24px;background:#767677}
.bz.l3{inset:5.98px;border-radius:65.75px;background:#212121}
.bz.l4{inset:8.97px;border-radius:62.76px;background:#000}
.bz.sb{width:4.48px;background:linear-gradient(180deg,#a4a4a4 0,#666 7.69px,#666 calc(100% - 10.46px),#444 100%)}
.bz.sl{left:-4.48px;border-radius:2.99px 0 0 2.99px}
.bz.sr{right:-4.48px;border-radius:0 2.99px 2.99px 0}
body.framed .island{display:block}
.island{display:none;position:absolute;z-index:80;top:12px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;pointer-events:none}
/* fluid (webview) mode */
body:not(.framed) #stage{display:block}
body:not(.framed) .device{width:100%;height:100%}
body:not(.framed) .statusbar{display:none}
body:not(.framed){--sb:calc(env(safe-area-inset-top,0px) + 10px)}
.scale-wrap{transform-origin:center center}

/* ---------- status bar ---------- */
.statusbar{position:absolute;z-index:65;top:0;left:0;width:393px;height:62px;pointer-events:none}
.statusbar svg{display:block}

/* ---------- backgrounds ---------- */
.bg{position:absolute;left:0;top:0;width:100%;height:560px;z-index:0;opacity:0;transition:opacity .45s ease;pointer-events:none;overflow:hidden}
.bg svg{position:absolute;left:50%;top:0;width:393px;height:852px;margin-left:-196.5px}
.bg.on{opacity:1}

/* ---------- header ---------- */
.header{position:absolute;z-index:20;left:0;right:0;top:0;height:calc(var(--sb) + 94px)}
.back{position:absolute;left:16px;top:calc(var(--sb) + 8px);width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.62);backdrop-filter:blur(8px);display:grid;place-items:center;transition:transform .15s}
.back:active{transform:scale(.92)}
.tabs{position:absolute;left:0;right:0;bottom:0;height:43px;border-bottom:1px solid rgba(160,160,160,.35);display:flex;justify-content:center;gap:8px}
.tab{position:relative;height:42px;padding:0 8px;font-size:16px;line-height:42px;letter-spacing:0;color:var(--title);font-weight:400;transition:font-weight .15s}
.tab.on{font-weight:600}
.tab-ind{position:absolute;bottom:-1px;height:3px;border-radius:2px;background:var(--title);left:0;width:49px;pointer-events:none}

/* ---------- pager ---------- */
.pager{position:absolute;z-index:5;left:0;right:0;top:calc(var(--sb) + 94px);bottom:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pager::-webkit-scrollbar{display:none}
.page{position:relative;flex:0 0 100%;width:100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:0 16px calc(var(--dock-h) + 24px);-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14px);mask-image:linear-gradient(to bottom,transparent 0,#000 14px);transition:opacity .3s}
.page::-webkit-scrollbar{display:none}
.hero{position:relative;height:152px;display:flex;align-items:flex-end}
.plan-name{font-family:'Bricolage Grotesque','Inter',sans-serif;font-weight:800;font-size:40px;line-height:44px;letter-spacing:-1px;background:linear-gradient(180deg,var(--t1),var(--t2));-webkit-background-clip:text;background-clip:text;color:transparent;font-variation-settings:'opsz' 72}
.plan-price{font-size:16px;line-height:22px;font-weight:600;margin-top:4px}
.illus{position:absolute;right:-6px;top:4px;width:220px;height:159px;pointer-events:none;display:block}
.divider{height:1px;background:var(--stroke);opacity:.5;margin-top:24px}
.bullets{padding:24px 0 8px;display:flex;flex-direction:column;gap:32px}
.bullet{display:flex;gap:12px;align-items:flex-start;min-height:24px}
.bullet .txt{flex:1;font-size:16px;line-height:22px;font-weight:400}
.bullet .txt b{font-weight:600}
.logos{display:flex;margin-top:6px}
.logo{width:28px;height:28px;border-radius:50%;border:2px solid #fff;margin-right:-4px;flex:none;object-fit:cover;background:#fff;display:block}

/* icons (masked, themable) */
.ic{display:inline-block;flex:none;width:24px;height:24px;background:linear-gradient(180deg,var(--ic1),var(--ic2));-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.rico{position:relative;flex:none;width:24px;height:24px}
.rico img{position:absolute;left:-4px;top:-4px;width:32px;height:32px;max-width:none;display:block}
.ic.s16{width:16px;height:16px}
.ic.flat{background:var(--title);opacity:.9}

/* benefit list */
.list{margin-top:150px}
.sec-h{font-size:20px;line-height:26px;font-weight:800;font-family:'Bricolage Grotesque','Inter',sans-serif;letter-spacing:-.3px;margin:40px 0 4px}
.sec-h:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:12px;min-height:68px;padding:10px 0;cursor:pointer;transition:opacity .15s}
.row:active{opacity:.55}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:16px;line-height:22px}
.row .t span{display:block;font-size:12px;line-height:16px;color:var(--muted);margin-top:2px}
.row .chev{width:16px;height:16px;opacity:.85}
.note{font-size:10px;line-height:13px;color:var(--muted);text-align:center;padding:2px 8px 0}
.subs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.sub{height:68px;border-radius:12px;background:#f5f4f4;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:14px;line-height:20px;font-weight:600}
.sub .lg{width:40px;height:40px;border-radius:50%;flex:none;display:block}

/* ---------- dock (buttons) ---------- */
:root{--dock-h:172px;--dock-pb:40px}
body:not(.framed){--dock-pb:max(40px,env(safe-area-inset-bottom,0px));--dock-h:calc(132px + max(40px,env(safe-area-inset-bottom,0px)))}
.dock{position:absolute;z-index:15;left:0;right:0;bottom:0;background:#fff;padding:16px 16px var(--dock-pb);display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.3,.8,.3,1)}
#seeAll{margin-bottom:12px;max-height:52px;transition:max-height .28s ease,margin .28s ease,opacity .2s ease}
.dock.compact #seeAll{max-height:0;margin-bottom:0;opacity:0;pointer-events:none}
.btn{height:52px;border-radius:12px;font-size:14px;font-weight:600;display:grid;place-items:center;width:100%;transition:transform .12s,filter .12s;position:relative;overflow:hidden}
.btn:active{transform:scale(.985);filter:brightness(.95)}
.btn.sec{background:var(--gray-btn);color:var(--title)}
.btn.pri{background:var(--orange);color:#fff}
.btn .spin{display:none;width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .7s linear infinite}
.btn.loading .lbl{display:none}.btn.loading .spin{display:block}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- subscribe sheet ---------- */
.scrim{position:absolute;z-index:30;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;z-index:35;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:6px 16px 0;transform:translateY(105%);transition:transform .38s cubic-bezier(.25,.9,.3,1);box-shadow:0 -10px 40px rgba(0,0,0,.12);touch-action:none}
.sheet.on{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:#cfcfcf;margin:0 auto 21px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 12px;border:1px solid #d9d9d9;border-radius:12px;margin-bottom:10px;background:#fff;transition:border-color .15s,box-shadow .15s}
.opt.sel{border-color:#c9c9c9;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.radio{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid #8b8b8b;display:grid;place-items:center;transition:all .15s}
.opt.sel .radio{border-color:var(--orange);border-width:2px}
.opt.sel .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--orange)}
.opt .ot{flex:1;font-size:14px;line-height:20px;font-weight:600;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.opt .op{font-size:13px;font-weight:400}
.save{background:#d4f2cf;color:#1b6e28;font-size:11px;line-height:16px;font-weight:600;padding:0 5px;border-radius:4px}
.legal{margin:10px 0 0;font-size:9.5px;line-height:12px;color:#575757;text-align:center;padding:0 6px 40px}
.legal a{color:var(--orange);text-decoration:none}
body:not(.framed) .legal{padding-bottom:max(40px,env(safe-area-inset-bottom,0px))}

/* ---------- confirmation ---------- */
.confirm{position:absolute;z-index:60;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s}
.confirm.on{opacity:1;pointer-events:auto}
.confirm .cbg{position:absolute;left:0;top:0;width:100%;height:340px;background:radial-gradient(120% 100% at 50% 0%,var(--cb) 0,rgba(255,255,255,0) 72%)}
.confirm .av{position:absolute;left:50%;top:calc(var(--sb) + 77px);width:58px;height:58px;margin-left:-29px;border-radius:50%;padding:3px;background:linear-gradient(180deg,var(--t1),var(--t2));transition:background .3s}
.confirm .av span{display:block;width:100%;height:100%;border-radius:50%;background:#fff;padding:2.5px}
.confirm .av img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
.confirm h1{position:absolute;left:0;right:0;top:calc(var(--sb) + 148px);text-align:center;font-family:'Bricolage Grotesque','Inter',sans-serif;font-weight:800;font-size:28px;line-height:34px;letter-spacing:-.6px;font-variation-settings:'opsz' 72}
.confirm h1 em{font-style:normal;background:linear-gradient(180deg,var(--t1),var(--t2));-webkit-background-clip:text;background-clip:text;color:transparent}
.confirm p{position:absolute;left:0;right:0;top:calc(var(--sb) + 188px);text-align:center;font-size:14px;line-height:20px}
.bigcard{position:absolute;left:50%;margin-left:-117px;top:calc(var(--sb) + 314px);width:235px;transform:translateY(30px) scale(.94);opacity:0;transition:transform .8s cubic-bezier(.2,.9,.3,1) .15s,opacity .6s .15s}
.bigcard img{display:block;width:100%}
.cfade{position:absolute;left:0;right:0;top:calc(var(--sb) + 405px);bottom:0;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 44%,#fff);pointer-events:none}
.confirm.on .bigcard{transform:none;opacity:1}
.confirm .dock2{position:absolute;left:0;right:0;bottom:0;padding:0 16px;display:flex;flex-direction:column;gap:12px;padding-bottom:max(40px,env(safe-area-inset-bottom,0px))}
body.framed .confirm .dock2{padding-bottom:40px}
#confetti{position:absolute;inset:0;z-index:70;pointer-events:none}

.toast{position:absolute;z-index:90;left:50%;top:calc(var(--sb) + 8px);transform:translate(-50%,-24px);opacity:0;visibility:hidden;pointer-events:none;background:#1d1d1f;color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:12px;white-space:nowrap;transition:transform .35s cubic-bezier(.25,.9,.3,1),opacity .25s,visibility 0s .35s;max-width:90%;text-overflow:ellipsis;overflow:hidden}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .35s cubic-bezier(.25,.9,.3,1),opacity .25s,visibility 0s}

/* ---------- skeleton ---------- */
.skel{position:absolute;z-index:6;left:0;right:0;top:calc(var(--sb) + 94px);bottom:0;background:#fff;padding:0 16px;transition:opacity .35s;overflow:hidden}
.skel.off{opacity:0;pointer-events:none}
.sk{background:#efefef;border-radius:8px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:translateX(-100%);animation:sh 1.3s infinite}
@keyframes sh{to{transform:translateX(100%)}}
.skel .gfade{position:absolute;left:0;right:0;top:0;height:200px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff);pointer-events:none}

/* ---------- embed (inside plans.html frame) + touch cursor ---------- */
body.touch,body.touch *{cursor:url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%2734%27%20height=%2734%27%20viewBox=%270%200%2034%2034%27%3E%3Ccircle%20cx=%2717.0%27%20cy=%2717.0%27%20r=%2714.5%27%20fill=%27none%27%20stroke=%27rgba%280%2C0%2C0%2C.28%29%27%20stroke-width=%271.5%27/%3E%3Ccircle%20cx=%2717.0%27%20cy=%2717.0%27%20r=%2712.25%27%20fill=%27rgba%28128%2C128%2C128%2C.5%29%27%20stroke=%27rgba%28255%2C255%2C255%2C.95%29%27%20stroke-width=%271.5%27/%3E%3C/svg%3E") 17 17,auto!important}
body.touch:active,body.touch *:active{cursor:url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%2726%27%20height=%2726%27%20viewBox=%270%200%2026%2026%27%3E%3Ccircle%20cx=%2713.0%27%20cy=%2713.0%27%20r=%2710.5%27%20fill=%27none%27%20stroke=%27rgba%280%2C0%2C0%2C.28%29%27%20stroke-width=%271.5%27/%3E%3Ccircle%20cx=%2713.0%27%20cy=%2713.0%27%20r=%278.25%27%20fill=%27rgba%28128%2C128%2C128%2C.7%29%27%20stroke=%27rgba%28255%2C255%2C255%2C.95%29%27%20stroke-width=%271.5%27/%3E%3C/svg%3E") 13 13,auto!important}

/* ---------- dark mode (body.dark) ---------- */
body.dark{--title:#f6f1f0;--muted:#a9a09e;--stroke:#3a3a3c;--gray-btn:#2c2c2e;--surface:#0f0f10}
body.dark:not(.embed){background:#1a1a1a}
body.dark .back{background:rgba(44,44,46,.72)}
body.dark .back svg{stroke:var(--title)}
body.dark .dock,body.dark .sheet,body.dark .confirm,body.dark .skel{background:var(--surface)}
body.dark .sheet{box-shadow:0 -10px 40px rgba(0,0,0,.55)}
body.dark .scrim{background:rgba(0,0,0,.55)}
body.dark .grab{background:#48484a}
body.dark .opt{background:#1c1c1e;border-color:#3a3a3c}
body.dark .opt.sel{border-color:#5a5a5e;box-shadow:0 1px 6px rgba(0,0,0,.45)}
body.dark .radio{border-color:#8e8e93}
body.dark .opt.sel .radio{border-color:var(--orange)}
body.dark .save{background:#173d1c;color:#7fdc8c}
body.dark .legal{color:#a1a1a6}
body.dark .sub{background:#1c1c1e}
body.dark .logo{border-color:var(--surface);background:var(--surface)}
body.dark .sk{background:#232325}
body.dark .sk::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent)}
body.dark .skel .gfade{background:linear-gradient(180deg,rgba(15,15,16,0),var(--surface))}
body.dark .cfade{background:linear-gradient(180deg,rgba(15,15,16,0),var(--surface) 44%,var(--surface))}
body.dark .confirm .av span{background:var(--surface)}
body.dark .confirm .cbg{background:radial-gradient(120% 100% at 50% 0%,var(--cb) 0,rgba(15,15,16,0) 72%)}
body.dark .statusbar{filter:invert(1)}
body.dark .toast{background:#f2f2f7;color:#1d1d1f}
body.dark .page[data-plan=plus] .rico img{filter:brightness(1.15)}
body.dark .page[data-plan=metal] .rico img{filter:brightness(1.9) saturate(.9)}
body.dark .page[data-plan=velvet] .rico img{filter:brightness(1.8) saturate(1.15)}

/* page enter */
.bullet,.hero>*:not(.illus){animation:rise .5s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bullet:nth-child(2){animation-delay:.05s}.bullet:nth-child(3){animation-delay:.1s}.bullet:nth-child(4){animation-delay:.15s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="framed">
<div id="stage"><div class="device" id="device">
 <div class="bezel" aria-hidden="true"><i class="bz l1"></i><i class="bz l2"></i><i class="bz l3"></i><i class="bz l4"></i><i class="bz sb sl" style="top:185.29px;height:40.35px"></i><i class="bz sb sl" style="top:257.02px;height:67.24px"></i><i class="bz sb sl" style="top:342.19px;height:67.24px"></i><i class="bz sb sr" style="top:280.93px;height:104.60px"></i></div>
 <div class="screen" id="screen" data-plan="plus">
  <div class="island"></div>

  <!-- backgrounds (Figma "Gradient-fixed" per plan) -->
  <div class="bg on" id="bg-plus"><svg viewBox="0 0 393 852" fill="none"><defs><filter id="fa" x="-229.6" y="-409.6" width="852.2" height="685.2" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="114.8"/></filter><filter id="fb" x="-109.6" y="-215.6" width="613.2" height="376.2" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="64.8"/></filter><linearGradient id="ga" x1="197" y1="-86" x2="197" y2="31" gradientUnits="userSpaceOnUse"><stop stop-color="#462AC6"/><stop offset="1" stop-color="#7D63F2"/></linearGradient></defs><g filter="url(#fa)"><ellipse cx="196.5" cy="-67" rx="196.5" ry="113" fill="#0065C2"/></g><g opacity=".75" filter="url(#fb)"><ellipse cx="197" cy="-27.5" rx="177" ry="58.5" fill="url(#ga)" fill-opacity=".75"/></g></svg></div>
  <div class="bg" id="bg-metal"><svg viewBox="0 0 393 852" fill="none"><defs><filter id="fc" x="-229.6" y="-409.6" width="852.2" height="685.2" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="114.8"/></filter></defs><g filter="url(#fc)"><ellipse cx="196.5" cy="-67" rx="196.5" ry="113" fill="#3E3E3E"/></g></svg></div>

/* tab indicator follows the horizontal scroll (interpolated) */
function layoutInd(){
  const w=pager.clientWidth||393, pos=pager.scrollLeft/w;
  const a=Math.floor(pos),b=Math.min(a+1,2),f=pos-a;
  const L=i=>tabs[i].offsetLeft, W=i=>tabs[i].offsetWidth;
  const left=L(a)+(L(b)-L(a))*f, width=W(a)+(W(b)-W(a))*f;
  ind.style.transform=`translateX(${left}px)`;ind.style.width=width+'px';
  const n=Math.round(pos);if(n!==idx){idx=n;applyPlan(n)}
}
pager.addEventListener('scroll',layoutInd,{passive:true});
tabs.forEach((t,i)=>t.addEventListener('click',()=>{pager.scrollTo({left:i*pager.clientWidth,behavior:'smooth'});}));
function goPlan(i,instant){pager.scrollTo({left:i*pager.clientWidth,behavior:instant?'instant':'smooth'});}

/* ---------- swipe between plans (touch is native scroll-snap; this adds mouse drag + arrow keys) ---------- */
(()=>{
  let down=false,x0=0,y0=0,sl0=0,lock=null,moved=false,lastX=0,lastT=0,vx=0;
  pager.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='mouse'||e.button!==0||S.stage!=='paywall')return;
    down=true;x0=lastX=e.clientX;y0=e.clientY;sl0=pager.scrollLeft;lock=null;moved=false;vx=0;lastT=performance.now();
  });
  addEventListener('pointermove',e=>{
    if(!down)return;
    const dx=e.clientX-x0,dy=e.clientY-y0;
    if(!lock){if(Math.abs(dx)<6&&Math.abs(dy)<6)return;lock=Math.abs(dx)>Math.abs(dy)?'x':'y';if(lock==='x'){pager.style.scrollSnapType='none';document.body.classList.add('dragging')}}
    if(lock!=='x')return;
    moved=true;
    const sc=screen.getBoundingClientRect().width/screen.offsetWidth||1;      /* device is CSS-scaled */
    pager.scrollLeft=sl0-dx/sc;
    const now=performance.now();vx=(e.clientX-lastX)/Math.max(1,now-lastT);lastX=e.clientX;lastT=now;
  });
  const end=()=>{
    if(!down)return;down=false;
    if(lock!=='x'){return}
    document.body.classList.remove('dragging');
    const w=pager.clientWidth,pos=pager.scrollLeft/w;
    let t=Math.round(pos);
    if(Math.abs(vx)>.35)t=vx<0?Math.ceil(pos-.02):Math.floor(pos+.02);   /* quick flick goes to the next plan */
    t=Math.max(0,Math.min(2,t));
    pager.style.scrollSnapType='';
    pager.scrollTo({left:t*w,behavior:'smooth'});
    setTimeout(()=>{moved=false},0);
  };
  addEventListener('pointerup',end);addEventListener('pointercancel',end);
  /* a drag must not count as a tap on a benefit row / tab */
  document.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault()}},true);
  addEventListener('keydown',e=>{
    if(S.stage!=='paywall')return;
    if(e.key==='ArrowRight')goPlan(Math.min(2,idx+1));
    if(e.key==='ArrowLeft')goPlan(Math.max(0,idx-1));
  });
})();

/* ---------- bridge ---------- */
const handlers={};
window.Paywall={on:(e,f)=>{(handlers[e]=handlers[e]||[]).push(f)},state:S};
function emit(type,payload={}){
  const msg=JSON.stringify({source:'satispay-paywall',type,...payload});
  (handlers[type]||[]).forEach(f=>f(payload));
  try{window.ReactNativeWebView&&window.ReactNativeWebView.postMessage(msg)}catch(e){}
  try{window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.paywall&&window.webkit.messageHandlers.paywall.postMessage(payload.type?payload:{type,...payload})}catch(e){}
  try{window.Android&&window.Android.paywall&&window.Android.paywall(msg)}catch(e){}
  try{if(window.parent!==window)window.parent.postMessage(msg,'*')}catch(e){}
}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1900)}

/* ---------- confetti ---------- */
function confetti(){
  const c=$('#confetti'),r=screen.getBoundingClientRect();
  const scale=r.width/screen.offsetWidth||1;
  c.width=screen.offsetWidth*2;c.height=screen.offsetHeight*2;c.style.width='100%';c.style.height='100%';
  const g=c.getContext('2d');g.scale(2,2);
  const W=screen.offsetWidth,H=screen.offsetHeight,cols=['#f54a4a','#ffb020','#3b8cff','#36c34f','#a65cf0','#ff6a2f'];
  const ps=Array.from({length:90},()=>({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*1.2,vy:1.6+Math.random()*2.6,w:4+Math.random()*7,h:3+Math.random()*9,r:Math.random()*6.28,vr:(Math.random()-.5)*.25,c:cols[Math.random()*cols.length|0],rib:Math.random()<.18}));
  let t0=performance.now();
  (function f(t){
    const el=(t-t0)/1000;g.clearRect(0,0,W,H);
    ps.forEach(p=>{p.x+=p.vx+Math.sin(el*3+p.r)*.4;p.y+=p.vy;p.r+=p.vr;
      g.save();g.translate(p.x,p.y);g.rotate(p.r);g.globalAlpha=Math.max(0,Math.min(1,(H-p.y)/(H*.25)));g.fillStyle=p.c;g.strokeStyle=p.c;
      if(p.rib){g.lineWidth=2.5;g.lineCap='round';g.beginPath();g.moveTo(-8,0);g.bezierCurveTo(-3,-8,3,8,8,0);g.stroke()}else g.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      g.restore()});
    if(el<4.5)requestAnimationFrame(f);else g.clearRect(0,0,W,H);
  })(t0);
}

/* ---------- mode + scaling ---------- */
function layoutMode(){
  const forced=qp.get('frame');
  const framed=forced!==null?forced==='1':(innerWidth>520&&innerHeight>=520);
  document.body.classList.toggle('framed',framed);
  const d=$('#device');
  if(framed){
    const m=document.body.classList.contains('embed')?24:40;
    const k=document.body.classList.contains('embed')?(parseFloat(qp.get('zoom'))||.85):1;
    const s=k*Math.min(1,(innerHeight-m)/891,(innerWidth-m)/441);
    d.style.transform=`scale(${s})`;
  }else d.style.transform='';
  layoutInd();
}
addEventListener('resize',layoutMode);

/* ---------- theme / embed ---------- */
function setTheme(t){
  document.body.classList.toggle('dark',t==='dark');document.documentElement.classList.toggle('dark',t==='dark');
  $$('.page').forEach(pg=>Object.entries(themeVars(pg.dataset.plan)).forEach(([a,b])=>pg.style.setProperty(a,b)));
  applyPlan(idx);
}
window.Paywall.setTheme=setTheme;
addEventListener('message',e=>{const d=e.data;if(d&&d.type==='paywall-theme')setTheme(d.theme==='dark'?'dark':'light')});

if(qp.get('cursor')==='touch')document.body.classList.add('touch');

/* ---------- boot ---------- */
(function boot(){
  const start=Math.max(0,ORDER.indexOf(qp.get('plan')||'plus'));
  if(qp.get('theme')==='dark'){document.body.classList.add('dark');document.documentElement.classList.add('dark')}
  layoutMode();
  applyPlan(start);idx=start;
  requestAnimationFrame(()=>{goPlan(start,true);layoutInd()});
  const delay=qp.get('skeleton')==='0'?0:900;
  setTimeout(()=>$('#skel').classList.add('off'),delay);
  document.fonts&&document.fonts.ready.then(layoutInd);
})();
